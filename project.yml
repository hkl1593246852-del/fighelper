name: fighelper
options:
  bundleIdPrefix: com.you
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

targets:
  fighelper:
    type: application
    platform: iOS
    sources:
      - path: src
        excludes:
          - Info.plist
          - fighelper.entitlements
    info:
      path: src/Info.plist
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: src/fighelper.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.you.fighelper
        PRODUCT_NAME: fighelper
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        GCC_ENABLE_OBJC_ARC: NO
        CLANG_ENABLE_OBJC_ARC: NO
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: NO
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO
        ONLY_ACTIVE_ARCH: NO
        ARCHS: arm64

  dovipoc:
    type: application
    platform: iOS
    sources:
      - path: dovi
        includes:
          - main.m
        excludes:
          - Info.plist
      - path: dovi
        includes:
          - "*.bin"
        buildPhase: resources
    info:
      path: dovi/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.you.dovipoc
        PRODUCT_NAME: dovipoc
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CLANG_ENABLE_OBJC_ARC: YES
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: NO
        ONLY_ACTIVE_ARCH: NO
        ARCHS: arm64

  filzalite:
    type: application
    platform: iOS
    sources:
      - path: flz
        excludes:
          - Info.plist
          - filzalite.entitlements
    info:
      path: flz/Info.plist
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: flz/filzalite.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.you.filzalite
        PRODUCT_NAME: filzalite
        SWIFT_OBJC_BRIDGING_HEADER: flz/Bridge.h
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: NO
        ONLY_ACTIVE_ARCH: NO
        ARCHS: arm64
