name: aircard

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/aircard.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream
        run: |
          git clone --depth 1 https://github.com/0xjohnnydev/AirCard-iOS.git aircard
          du -sh aircard
          ls aircard
          ls -R aircard/AirliftFFI.xcframework | head -n 30

      - name: Repair xcframework Info.plist
        run: |
          # The repo ships the two slices but not the container Info.plist, so
          # Xcode 16 refuses the dependency. Rebuild the manifest for a static
          # library xcframework with an arm64 device slice and an arm64 sim slice.
          cat > aircard/AirliftFFI.xcframework/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>AvailableLibraries</key>
            <array>
              <dict>
                <key>LibraryIdentifier</key><string>ios-arm64</string>
                <key>LibraryPath</key><string>libairlift_ffi.a</string>
                <key>SupportedArchitectures</key><array><string>arm64</string></array>
                <key>SupportedPlatform</key><string>ios</string>
              </dict>
              <dict>
                <key>LibraryIdentifier</key><string>ios-arm64-simulator</string>
                <key>LibraryPath</key><string>libairlift_ffi.a</string>
                <key>SupportedArchitectures</key><array><string>arm64</string></array>
                <key>SupportedPlatform</key><string>ios</string>
                <key>SupportedPlatformVariant</key><string>simulator</string>
              </dict>
            </array>
            <key>CFBundlePackageType</key><string>XFWK</string>
            <key>XCFrameworkFormatVersion</key><string>1.0</string>
          </dict>
          </plist>
          PLIST
          sed -i '' 's/^          //' aircard/AirliftFFI.xcframework/Info.plist
          plutil -lint aircard/AirliftFFI.xcframework/Info.plist

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Link the static lib by hand
        run: |
          # XcodeGen models the xcframework as a framework dependency, which only
          # yields FRAMEWORK_SEARCH_PATHS. AirliftFFI is a static .a with a
          # modulemap, so wire the search paths and -lairlift_ffi explicitly.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("aircard/project.yml")
          s = p.read_text()
          s = s.replace("""    dependencies:
      - framework: AirliftFFI.xcframework
        embed: false
""", "")
          s = s.replace('        OTHER_LDFLAGS: "-lc++"',
              '        OTHER_LDFLAGS: "-lairlift_ffi -lc++"\n'
              '        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/AirliftFFI.xcframework/ios-arm64"\n'
              '        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/AirliftFFI.xcframework/ios-arm64/Headers"\n'
              '        HEADER_SEARCH_PATHS: "$(SRCROOT)/AirliftFFI.xcframework/ios-arm64/Headers"')
          p.write_text(s)
          print(s)
          PY

      - name: Build unsigned IPA
        run: |
          cd aircard
          chmod +x build-ipa.sh
          ./build-ipa.sh Release

      - name: Verify payload
        run: |
          ls -l aircard/build/AirCard-iOS.ipa
          unzip -l aircard/build/AirCard-iOS.ipa | head -n 20
          shasum -a 256 aircard/build/AirCard-iOS.ipa | tee aircard/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: aircard-ipa
          path: |
            aircard/build/AirCard-iOS.ipa
            aircard/sha256.txt
          retention-days: 30
