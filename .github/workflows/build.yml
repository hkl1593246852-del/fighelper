name: build-ipa

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          xcodebuild -project fighelper.xcodeproj -list

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project fighelper.xcodeproj \
            -target fighelper \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -n 400

      - name: Locate app bundle
        run: |
          APP=$(find . -name 'fighelper.app' -maxdepth 5 -type d | head -n 1)
          echo "APP=$APP"
          test -n "$APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Diagnostics
        run: |
          OBJ=build/fighelper.build/Release-iphoneos/fighelper.build/Objects-normal/arm64
          echo "== source identity =="
          wc -c -l src/Fig.m
          md5 -q src/Fig.m
          echo "-- head --"; sed -n '1,6p' src/Fig.m
          echo "-- tail --"; tail -n 6 src/Fig.m
          echo "== objects =="
          ls -l "$OBJ" | grep -E '\.o$' || true
          echo "== Fig.o first strings =="
          strings "$OBJ/Fig.o" | head -n 40
          echo "== Fig.o strings hit count =="
          strings "$OBJ/Fig.o" | grep -cE 'STEP2|CreationURL|queue\.txt' || true
          echo "== final binary strings hit count =="
          strings "$APP_PATH/fighelper" | grep -cE 'STEP2|CreationURL|queue\.txt' || true

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry fighelper-unsigned.ipa Payload
          ls -l fighelper-unsigned.ipa
          shasum -a 256 fighelper-unsigned.ipa | tee sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: fighelper-ipa
          path: |
            fighelper-unsigned.ipa
            sha256.txt
          retention-days: 30
