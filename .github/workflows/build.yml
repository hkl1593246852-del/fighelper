name: build-ipa

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stamp build id
        run: |
          SHORT=$(git rev-parse --short=8 HEAD)
          printf '#ifndef BUILD_INFO_H\n#define BUILD_INFO_H\n#define FIG_BUILD_ID "%s"\n#endif\n' "$SHORT" > src/BuildInfo.h
          cat src/BuildInfo.h

      - name: Generate Xcode project
        run: |
          xcodegen generate
          xcodebuild -project fighelper.xcodeproj -list

      - name: Build fighelper
        run: |
          set -o pipefail
          xcodebuild -project fighelper.xcodeproj -target fighelper \
            -configuration Release -sdk iphoneos -arch arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -n 200

      - name: Build dovipoc
        run: |
          set -o pipefail
          xcodebuild -project fighelper.xcodeproj -target dovipoc \
            -configuration Release -sdk iphoneos -arch arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -n 200

      - name: Locate bundles
        run: |
          F=$(find . -name 'fighelper.app' -maxdepth 5 -type d | head -n 1)
          D=$(find . -name 'dovipoc.app' -maxdepth 5 -type d | head -n 1)
          echo "F=$F"; echo "D=$D"
          test -n "$F"; test -n "$D"
          echo "F_APP=$F" >> "$GITHUB_ENV"
          echo "D_APP=$D" >> "$GITHUB_ENV"

      - name: Diagnostics
        run: |
          echo "== dovipoc contents =="
          ls -l "$D_APP" | head -n 20
          echo "== resources =="
          ls -l "$D_APP"/*.bin || true

      - name: Package IPAs
        run: |
          rm -rf Payload Payload2
          mkdir -p Payload Payload2
          cp -R "$F_APP" Payload/
          cp -R "$D_APP" Payload2/
          zip -qry fighelper-unsigned.ipa Payload
          zip -qry dovipoc-unsigned.ipa Payload2
          ls -l *.ipa
          shasum -a 256 *.ipa | tee sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ipas
          path: |
            fighelper-unsigned.ipa
            dovipoc-unsigned.ipa
            sha256.txt
          retention-days: 30
