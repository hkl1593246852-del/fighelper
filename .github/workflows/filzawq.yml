name: filzawq

# Builds on ubuntu-latest: Theos supports Linux, and Linux runner minutes are
# billed 1x instead of the 10x macOS surcharge that ran the account out.
#
# Base IPA, first match wins:
#   filza/Filza.ipa      stock Filza 5.0.1, loaded through the lib7z slot
#   filza/base-wq.ipa    Filza 4.0.0 with a FilzaApplySandboxExt slot

on:
  push:
    branches: [ main ]
    paths:
      - 'flzq/**'
      - 'flz/**'
      - 'ci/**'
      - 'filza/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang make perl zip unzip libtapi-dev xz-utils >/dev/null
          clang --version | head -n 2

      - name: Pick a base IPA
        run: |
          mkdir -p filza
          if [ -f filza/Filza.ipa ]; then
            echo "BASE=filza/Filza.ipa" >> "$GITHUB_ENV"
          elif [ -f filza/base-wq.ipa ]; then
            echo "BASE=filza/base-wq.ipa" >> "$GITHUB_ENV"
          elif [ -n "${{ vars.FILZA_IPA_URL }}" ]; then
            curl -fL --retry 3 -o filza/base.ipa "${{ vars.FILZA_IPA_URL }}"
            echo "BASE=filza/base.ipa" >> "$GITHUB_ENV"
          else
            echo "::error::no base IPA in filza/"
            exit 1
          fi
          echo "base: $BASE"

      - name: Build + inject
        run: |
          chmod +x ci/build_filzawq.sh
          THEOS="$HOME/theos" ./ci/build_filzawq.sh "$BASE" build/FilzaWQ.ipa

      - name: Verify
        run: |
          unzip -l build/FilzaWQ.ipa | head -n 20
          shasum -a 256 build/FilzaWQ.ipa | tee build/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: filzawq-ipa
          path: |
            build/FilzaWQ.ipa
            build/sha256.txt
          retention-days: 30
