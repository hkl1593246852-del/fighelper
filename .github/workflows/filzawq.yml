name: filzawq

# Builds the diagnostic dylib into a Filza base:
#   filza/base-wq.ipa   Filza 4.0.0 with a FilzaApplySandboxExt slot (preferred)
#   filza/Filza.ipa     stock Filza 5.0.1, handled through the lib7z slot

on:
  push:
    branches: [ main ]
    paths:
      - 'flzq/**'
      - 'flz/**'
      - 'ci/build_filzawq.sh'
      - 'filza/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pick a base IPA
        run: |
          mkdir -p filza
          if [ -f filza/base-wq.ipa ]; then
            echo "BASE=filza/base-wq.ipa" >> "$GITHUB_ENV"
          elif [ -f filza/Filza.ipa ]; then
            echo "BASE=filza/Filza.ipa" >> "$GITHUB_ENV"
          elif [ -n "${{ vars.FILZA_IPA_URL }}" ]; then
            curl -fL --retry 3 -o filza/base.ipa "${{ vars.FILZA_IPA_URL }}"
            echo "BASE=filza/base.ipa" >> "$GITHUB_ENV"
          else
            echo "::error::no base IPA in filza/"
            exit 1
          fi
          echo "base: $BASE"

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install ldid xz 2>/dev/null || brew install ldid

      - name: Build + inject
        run: |
          chmod +x ci/build_filzawq.sh
          THEOS="$HOME/theos" ./ci/build_filzawq.sh "$BASE" build/FilzaWQ.ipa

      - name: Verify
        run: |
          unzip -l build/FilzaWQ.ipa | head -n 20
          unzip -l build/FilzaWQ.ipa | grep -E 'FilzaApplySandboxExt|lib7z_orig|\.app/Filza$' || true
          shasum -a 256 build/FilzaWQ.ipa | tee build/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: filzawq-ipa
          path: |
            build/FilzaWQ.ipa
            build/sha256.txt
          retention-days: 30
